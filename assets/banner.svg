<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#101528" />
      <stop offset="100%" stop-color="#07090f" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#e879f9">
        <animate attributeName="stop-color" values="#e879f9; #38bdf8; #818cf8; #e879f9" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <!-- Laser Line Gradients -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      .laser-pulse {
        stroke-dasharray: 120 400;
        animation: laserFlow 6s linear infinite;
      }
      @keyframes laserFlow {
        0% { stroke-dashoffset: 520; }
        100% { stroke-dashoffset: -520; }
      }
      .laser-pulse-rev {
        stroke-dasharray: 80 320;
        animation: laserFlowRev 5s linear infinite;
      }
      @keyframes laserFlowRev {
        0% { stroke-dashoffset: -400; }
        100% { stroke-dashoffset: 400; }
      }
      .pulse-slow {
        animation: pulseScale 7s ease-in-out infinite alternate;
      }
      @keyframes pulseScale {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.6; }
        100% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.9; }
      }
      .float-badge {
        animation: floatItem 4s ease-in-out infinite alternate;
      }
      @keyframes floatItem {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
      .chip-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="340" rx="16" fill="url(#gridPattern)" />
  <rect width="1200" height="340" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Dynamic Animated Ambient Glow Orbs in Background -->
  <g class="pulse-slow" style="transform-origin: 250px 100px;">
    <circle cx="200" cy="110" r="140" fill="url(#orbCyan)" filter="url(#glowFilter)" />
  </g>
  <g class="pulse-slow" style="transform-origin: 950px 220px; animation-delay: -3s;">
    <circle cx="1000" cy="210" r="150" fill="url(#orbPurple)" filter="url(#glowFilter)" />
  </g>
  <g class="pulse-slow" style="transform-origin: 600px 170px; animation-delay: -1.5s;">
    <circle cx="600" cy="170" r="120" fill="url(#orbPink)" filter="url(#glowFilter)" />
  </g>

  <!-- Animated Circuit & Laser Lines (Background Flow Layer) -->
  <g opacity="0.6">
    <path d="M 60 70 L 320 70 L 410 120 L 790 120 L 880 70 L 1140 70" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 60 70 L 320 70 L 410 120 L 790 120 L 880 70 L 1140 70" fill="none" stroke="url(#laserGrad)" stroke-width="2.5" class="laser-pulse" />

    <path d="M 90 270 L 350 270 L 440 220 L 760 220 L 850 270 L 1110 270" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 90 270 L 350 270 L 440 220 L 760 220 L 850 270 L 1110 270" fill="none" stroke="url(#laserGrad)" stroke-width="2.5" class="laser-pulse-rev" />
  </g>

  <!-- Floating Tech Ecosystem Chips (Subtle Decorative Background-Midground) -->
  <g class="float-badge" opacity="0.85">
    <!-- Vite -->
    <g transform="translate(80, 140)">
      <rect width="84" height="28" rx="14" fill="#0f172a" stroke="#bd34fe" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#bd34fe" />
      <text x="28" y="18" fill="#e2e8f0" class="chip-text">⚡ Vite</text>
    </g>
    <!-- Webpack -->
    <g transform="translate(190, 190)" style="animation-delay: -1s;">
      <rect width="102" height="28" rx="14" fill="#0f172a" stroke="#1c78c0" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#1c78c0" />
      <text x="28" y="18" fill="#e2e8f0" class="chip-text">📦 Webpack</text>
    </g>
    <!-- Turbopack -->
    <g transform="translate(930, 135)" style="animation-delay: -2s;">
      <rect width="112" height="28" rx="14" fill="#0f172a" stroke="#0070f3" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#0070f3" />
      <text x="28" y="18" fill="#e2e8f0" class="chip-text">🚀 Turbopack</text>
    </g>
    <!-- Rspack -->
    <g transform="translate(1010, 185)" style="animation-delay: -0.5s;">
      <rect width="98" height="28" rx="14" fill="#0f172a" stroke="#f97316" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#f97316" />
      <text x="28" y="18" fill="#e2e8f0" class="chip-text">🦀 Rspack</text>
    </g>
    <!-- Bun -->
    <g transform="translate(100, 215)" style="animation-delay: -2.5s;">
      <rect width="80" height="28" rx="14" fill="#0f172a" stroke="#fbf0df" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#f472b6" />
      <text x="28" y="18" fill="#e2e8f0" class="chip-text">🥟 Bun</text>
    </g>
    <!-- esbuild -->
    <g transform="translate(900, 85)" style="animation-delay: -1.8s;">
      <rect width="92" height="28" rx="14" fill="#0f172a" stroke="#ffcf00" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#ffcf00" />
      <text x="28" y="18" fill="#e2e8f0" class="chip-text">⚡ esbuild</text>
    </g>
  </g>

  <!-- Foreground Protective Soft Gradient Backplate for Text Clarity -->
  <rect x="290" y="55" width="620" height="230" rx="20" fill="#0b0f19" fill-opacity="0.75" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />

  <!-- Main Foreground Content (Always in Front, Unobscured) -->
  <g text-anchor="middle" id="foreground-content">
    <!-- Category Pill -->
    <g transform="translate(600, 88)">
      <rect x="-125" y="-14" width="250" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text y="4.5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
        📦 WEB ARCHITECTURE &amp; TOOLING
      </text>
    </g>

    <!-- Main Title with Gradient and Drop Shadow -->
    <text x="600" y="146" fill="url(#titleGrad)" filter="url(#textShadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Module Bundlers
    </text>

    <!-- Subtitle -->
    <text x="600" y="184" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">
      Curated Guide to ESM Dev Servers, Rust/Go Build Engines &amp; Bundling Pipelines
    </text>

    <!-- Subtitle Meta Description -->
    <text x="600" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Benchmarks • Architectural Comparisons • SaaS Infrastructure • Open-Source Tools
    </text>

    <!-- Feature Pillars Badges Bar -->
    <g transform="translate(600, 252)">
      <!-- Feature 1 -->
      <g transform="translate(-210, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8" />
        <text y="4" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">⚡ Instant HMR</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(-70, 0)">
        <rect x="-70" y="-12" width="140" height="24" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="0.8" />
        <text y="4" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">🦀 Rust &amp; Go Powered</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-12" width="140" height="24" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="0.8" />
        <text y="4" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">✂️ Tree-Shaking</text>
      </g>
      <!-- Feature 4 -->
      <g transform="translate(220, 0)">
        <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="0.8" />
        <text y="4" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">🌐 Cloud Caching</text>
      </g>
    </g>
  </g>
</svg>
